name: idealo-feed
"on": {schedule: [{cron: "7 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {name: Feed holen und speichern, run: 'curl -sS --fail --retry 5 --retry-all-errors --retry-delay 30 -A HeavenSt0re-Feed-Bot -o idealo.csv "https://heavenst0re.de/pages/idealo-feed?view=idealo"; head -1 idealo.csv | grep -q sku; git config user.name feed-bot; git config user.email feed-bot@users.noreply.github.com; git add idealo.csv; git commit -m "Feed aktualisiert" || exit 0; git push'}]}}
