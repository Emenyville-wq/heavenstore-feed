name: idealo-feed
on:
schedule:
- cron: "7 * * * *"
workflow_dispatch:
permissions:
contents: write
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Feed holen und speichern
run: |
ok=0
for i in 1 2 3 4 5; do
code=$(curl -sS -o feed.tmp -w "%{http_code}" -A "HeavenSt0re-Feed-Bot" "https://heavenst0re.de/pages/idealo-feed?view=idealo&cb=$(date +%s)")
if [ "code" = "200" ] && head -1 feed.tmp | grep -q '^"sku"' && [ " (wc -l < feed.tmp)" -ge 2 ]; then ok=1; break; fi
sleep 60
done
[ "$ok" = "1" ] || exit 1
mv feed.tmp idealo.csv
git config user.name feed-bot
git config user.email feed-bot@users.noreply.github.com
git add idealo.csv
git diff --staged --quiet || git commit -m "Feed aktualisiert"
git push
